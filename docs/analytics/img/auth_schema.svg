<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 450" width="550" height="450" style="--bg:#18181B;--fg:#F4F4F5;--line:#71717A;--muted:#A1A1AA;--surface:#27272A;--border:#3F3F46;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>

<!-- RELATIONSHIPS -->
<!-- users -> buyer_profiles (1 to 0..1) -->
<polyline class="er-relationship" data-entity1="users" data-entity2="buyer_profiles" data-cardinality1="one" data-cardinality2="zero-one" points="240,95 300,95" fill="none" stroke="var(--_line)" stroke-width="1.25" />
<circle cx="285" cy="95" r="3.5" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.2" />
<line x1="293" y1="90" x2="293" y2="100" stroke="var(--_line)" stroke-width="1.2" />

<!-- users -> seller_profiles (1 to 0..1) -->
<polyline class="er-relationship" data-entity1="users" data-entity2="seller_profiles" data-cardinality1="one" data-cardinality2="zero-one" points="240,140 270,140 270,285 300,285" fill="none" stroke="var(--_line)" stroke-width="1.25" />
<circle cx="285" cy="285" r="3.5" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.2" />
<line x1="293" y1="280" x2="293" y2="290" stroke="var(--_line)" stroke-width="1.2" />

<!-- ==================== 1. USERS ==================== -->
<g class="entity" data-id="users" data-label="users">
  <rect x="30" y="40" width="210" height="190" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="40" width="210" height="34" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="135" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">users</text>
  <line x1="30" y1="74" x2="240" y2="74" stroke="var(--_node-stroke)" stroke-width="0.75" />

  <!-- id (PK) -->
  <rect x="36" y="78" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="47.155" y="85" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">PK</text>
  <text x="66.31" y="85" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">uuid</tspan></text>
  <text x="232" y="85" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">id</tspan></text>

  <!-- email (UK) -->
  <rect x="36" y="100" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="47.155" y="107" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">UK</text>
  <text x="66.31" y="107" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="232" y="107" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">email</tspan></text>

  <!-- password_hash -->
  <text x="38" y="129" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="232" y="129" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">password_hash</tspan></text>

  <!-- role -->
  <text x="38" y="151" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">user_role</tspan></text>
  <text x="232" y="151" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">role</tspan></text>

  <!-- department -->
  <text x="38" y="173" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="232" y="173" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">department</tspan></text>

  <!-- created_at -->
  <text x="38" y="195" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="232" y="195" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">created_at</tspan></text>

  <!-- updated_at -->
  <text x="38" y="217" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="232" y="217" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">updated_at</tspan></text>
</g>

<!-- ==================== 2. BUYER_PROFILES ==================== -->
<g class="entity" data-id="buyer_profiles" data-label="buyer_profiles">
  <rect x="300" y="40" width="220" height="168" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="300" y="40" width="220" height="34" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="410" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">buyer_profiles</text>
  <line x1="300" y1="74" x2="520" y2="74" stroke="var(--_node-stroke)" stroke-width="0.75" />

  <!-- id (PK) -->
  <rect x="306" y="78" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="317.155" y="85" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">PK</text>
  <text x="336.31" y="85" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">uuid</tspan></text>
  <text x="512" y="85" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">id</tspan></text>

  <!-- user_id (FK, UK) -->
  <rect x="306" y="100" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="317.155" y="107" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">FK</text>
  <text x="336.31" y="107" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">uuid</tspan></text>
  <text x="512" y="107" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">user_id</tspan></text>

  <!-- full_name -->
  <text x="308" y="129" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="512" y="129" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">full_name</tspan></text>

  <!-- phone -->
  <text x="308" y="151" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="512" y="151" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">phone</tspan></text>

  <!-- created_at -->
  <text x="308" y="173" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="512" y="173" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">created_at</tspan></text>

  <!-- updated_at -->
  <text x="308" y="195" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="512" y="195" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">updated_at</tspan></text>
</g>

<!-- ==================== 3. SELLER_PROFILES ==================== -->
<g class="entity" data-id="seller_profiles" data-label="seller_profiles">
  <rect x="300" y="230" width="220" height="190" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="300" y="230" width="220" height="34" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="410" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">seller_profiles</text>
  <line x1="300" y1="264" x2="520" y2="264" stroke="var(--_node-stroke)" stroke-width="0.75" />

  <!-- id (PK) -->
  <rect x="306" y="268" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="317.155" y="275" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">PK</text>
  <text x="336.31" y="275" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">uuid</tspan></text>
  <text x="512" y="275" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">id</tspan></text>

  <!-- user_id (FK, UK) -->
  <rect x="306" y="290" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="317.155" y="297" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">FK</text>
  <text x="336.31" y="297" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">uuid</tspan></text>
  <text x="512" y="297" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">user_id</tspan></text>

  <!-- company_name -->
  <text x="308" y="319" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="512" y="319" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">company_name</tspan></text>

  <!-- inn (UK) -->
  <rect x="306" y="332" width="22.31" height="14" rx="2" ry="2" fill="var(--_key-badge)" />
  <text x="317.155" y="339" text-anchor="middle" dy="0.35em" font-size="9" font-weight="600" fill="var(--_text-sec)">UK</text>
  <text x="336.31" y="339" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">varchar</tspan></text>
  <text x="512" y="339" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">inn</tspan></text>

  <!-- description -->
  <text x="308" y="363" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">text</tspan></text>
  <text x="512" y="363" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">description</tspan></text>

  <!-- created_at -->
  <text x="308" y="385" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="512" y="385" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">created_at</tspan></text>

  <!-- updated_at -->
  <text x="308" y="407" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-muted)">timestamptz</tspan></text>
  <text x="512" y="407" class="mono" text-anchor="end" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-sec)">updated_at</tspan></text>
</g>
</svg>
